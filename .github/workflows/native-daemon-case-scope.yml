name: Loop POSIX Case-Distinct Daemon Scope
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  case-scope-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test scripts/daemon-posix-case-scope-test.mjs
